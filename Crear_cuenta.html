<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Formulario de Transacción</title>
  <!-- Bootstrap 4 CSS -->
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/formularios_estilos.css">
</head>
<body>
<div class="container py-4">
    <div class="row justify-content-center">
      <!-- Ancho responsivo (más ancho en pantallas grandes) -->
      <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5">
        <div class="formulario bg-white">
          <h4 class="text-center mb-4 text-primary">Crear Cuenta</h4>

          <form>
            <!-- TODOS EN COLUMNA (uno bajo otro) -->
            <div class="form-group">
              <label for="nombre">Nombre</label>
              <input type="text" class="form-control" id="nombre" placeholder="Ingresa tu nombre" required>
            </div>

            <div class="form-group">
              <label for="apellido">Apellido</label>
              <input type="text" class="form-control" id="apellido" placeholder="Ingresa tu apellido" required>
            </div>

            <div class="form-group">
              <label for="edad">Dui</label>
              <input type="text" class="form-control" id="edad" placeholder="12345678-9" required>
            </div>

            <div class="form-group">
              <label for="correo">Correo Electrónico</label>
              <input type="email" class="form-control" id="correo" placeholder="usuario@correo.com" required>
            </div>

            <div class="form-group">
              <label for="pin">Nuevo número de PIN</label>
              <input type="password" class="form-control" id="pin" placeholder="••••••" minlength="4" required>
            </div>

            <div class="form-row mt-3">
              <div class="col-12 col-md-6 mb-2 mb-md-0">
                <button type="submit" class="btn btn-primary btn-block">Crear Cuenta</button>
              </div>
              <div class="col-12 col-md-6">
                <button type="reset" class="btn btn-outline-secondary btn-block">Cancelar</button>
              </div>
            </div>
          </form>

        </div>
      </div>
    </div>
  </div>

</body>
</html>
