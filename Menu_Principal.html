<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Menu Principal</title>

  <!-- Bootstrap 4 CSS -->
   <!-- Etiqueta HTML que sirve para enlace al archivo estilo Bootstrap 4 CSS 
   CDN (Content Delivery Network, o “Red de Entrega de Contenidos”) es una red de servidores distribuidos 
   por todo el mundo que almacenan y entregan archivos estáticos 
   —como imágenes, hojas de estilo (CSS) ylibrerías JavaScript
  -->
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
</head>
<body class="bg-light">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-light fixed-top shadow"
       style="background-color:#2A75BB;">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center text-white" href="#">
        <span class="mr-2">⚪️🔴</span>
        <span class="font-weight-bold">Pokemon Bank</span>
      </a>

      <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#pokeNavbar"
              aria-controls="pokeNavbar" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="pokeNavbar">
        <ul class="navbar-nav mr-auto">
          <li class="nav-item active">
            <a class="nav-link text-white" href="#">Inicio <span class="sr-only">(actual)</span></a>
          </li>
          <li class="nav-item"><a class="nav-link text-white" href="#">Deposito</a></li>

          <li class="nav-item"><a class="nav-link text-white" href="#">Retiros</a></li>
          <li class="nav-item"><a class="nav-link text-white" href="#">Pagos</a></li>
         <li class="nav-item"><a class="nav-link text-white" href="#">Consultar Saldo</a></li>
        </ul>
      
        </div>
      </div>
    </div>
  </nav>

  <!-- Separación por navbar fixed-top -->
  <div style="height:80px;"></div>

  <!-- Jumbotron de ejemplo -->
  <div class="container">
    <div class="jumbotron bg-white shadow-sm">
      <h1 class="display-4">Bienvenido a Pokemon Bank</h1>
      <p class="lead">
        Administra tus Poké-ahorros, realiza depósitos , retiros, consulta de saldo y pagos de servicios.
      </p>
    
    </div>
  </div>

</html>
