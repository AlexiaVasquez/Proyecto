<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Formulario Consultar Saldo</title>

  <!-- Bootstrap 4 -->
  <link rel="stylesheet"
        href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
  <!-- Estilos propios -->
  <link rel="stylesheet" href="css/formularios_estilos.css">
    <!-- Carga la librería de SweetAlert2  -->
  
</head>
<body>

  <div class="container py-4">
    <!-- Encabezado + botones -->
    <div class="d-flex flex-wrap align-items-center justify-content-between mb-3">
      <h4 class="mb-2 mb-sm-0">Consulta de Saldo</h4>
       <div class="form-row mt-3">
          <div class="col-12 col-md-6 mb-2 mb-md-0">
           <button type="button" class="btn btn-danger" id="btnCancelar">Regresar</a></button>
         </div>
         <br>
      
       </div>
    </div>
<form id="Formulario_ConsultaSaldo">
    <!-- Resumen de cuenta -->
    <div class="card shadow-sm border-0 mb-3">
      <div class="card-body">
        <div class="row">
          <div class="col-12 col-md">
            <small class="text-muted d-block">Cuenta</small>
            <strong id="cuenta"></strong>
          </div>
          <div class="col-12 col-md mt-2 mt-md-0">
            <small class="text-muted d-block">Titular</small>
            <strong id="nombreCliente"></strong>
          </div>
          <div class="col-12 col-md text-md-right mt-2 mt-md-0">
            <small class="text-muted d-block">Saldo disponible</small>
            <span class="h4 text-success mb-0" id="saldoDisponible"></span>
          </div>
        </div>
      </div>
    </div>
<div class="col-12 col-md-6 mb-2 mb-md-0">
           <button type="reset" class="btn btn-primary btn-block" id="btnGenerarPDF">Imprimir Comprobante</button>
         </div>
  </form>
  <!-- Carga la librería de SweetAlert2  -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>


   <!--  Carga la libreria de jsPDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <!--Archivo para las alertas y generar PDF JS -->
  <script src="js/AlertaPDF_ConsultarS.js"></script>
  <script src="js/Transacciones.js"></script>


</body>
</html>
